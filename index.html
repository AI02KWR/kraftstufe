<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Kraftstufe</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kraftstufe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Always dark by design: the same black palette in both viewer modes */
:root{
  --bg:#000000; --surface:#0D0D10; --raise:#17171C; --ink:#F5F5F7; --muted:#8D8D98; --line:#25252C;
  --red:#FF1F45; --red-dim:rgba(255,31,69,.14); --red-ink:#FFFFFF;
  --violet:#9D4DFF; --violet-dim:rgba(157,77,255,.18); --good:#3DDC97;
  --r-none:#3A3A44; --r0:#C27B45; --r1:#B8C2CD; --r2:#F2C230; --r3:#4FD1C5; --r4:#6C8CFF; --r5:#E03BFF;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000000; --surface:#0D0D10; --ink:#F5F5F7; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#000000; --surface:#0D0D10; --ink:#F5F5F7; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.training{padding-bottom:120px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 64px}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}

/* Hero */
.hero{position:relative;padding:6px 0 24px;margin-bottom:6px;isolation:isolate}
.hero:not(.slim)::before{content:"";position:absolute;right:0;top:-30px;width:min(340px,85vw);height:340px;background:radial-gradient(circle,rgba(157,77,255,.22),transparent 65%);z-index:-1;pointer-events:none}
.hero:not(.slim)::after{content:"";position:absolute;left:-10px;top:40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,31,69,.12),transparent 65%);z-index:-1;pointer-events:none}
.brand{display:flex;justify-content:space-between;align-items:center;font:15px/1 var(--display);letter-spacing:.06em;color:var(--red);margin-bottom:14px}
.brand .tot{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--body);letter-spacing:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(13,13,16,.85);border:1px solid var(--line);border-radius:16px;min-width:0}
.stat b{display:block;font:26px/1 var(--display);letter-spacing:.01em}
.stat span{display:block;font-size:12px;color:var(--muted);line-height:1.25;margin-top:3px}
.stat>svg{flex:none}
.dots{display:flex!important;gap:6px;height:34px;align-items:center;margin:0!important}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--red);border-color:var(--red);box-shadow:0 0 10px var(--red)}
.flame path{transform-box:fill-box;transform-origin:50% 100%}
.flame .fo{animation:fl 1.7s ease-in-out infinite}
.flame .fi{animation:fl 1.15s ease-in-out infinite reverse}
.flame .fc{animation:fl .8s ease-in-out infinite}
.flame.f0 path{animation:none}
.flame.f3{filter:drop-shadow(0 0 6px rgba(157,77,255,.6))}
.flame.f2{filter:drop-shadow(0 0 5px rgba(255,90,40,.5))}
@keyframes fl{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.95,1.07) skewX(-3deg)}65%{transform:scale(1.03,.97) skewX(2deg)}}
.motiv{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.motiv b{display:block;font:24px/1.1 var(--display);letter-spacing:.01em}
.next{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 11px 4px 6px;border-radius:999px;background:var(--raise);color:var(--ink);font-size:13px;white-space:nowrap}
.next b{font-weight:700}
.next.sm{margin:0;font-size:12px;padding:3px 9px;color:var(--muted)}
.streakup{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 14px 6px 10px;border-radius:999px;background:var(--red-dim);font-weight:600}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end}
.lvl{font:clamp(104px,26vw,168px)/.8 var(--display);color:var(--ink);text-shadow:0 0 0 transparent}
.lvl small{display:block;font:600 14px/1 var(--body);color:var(--violet);margin-bottom:10px}
.lvl-title{font:30px/1 var(--display);letter-spacing:.01em}
.bar{height:10px;background:var(--raise);border-radius:5px;margin:12px 0 8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--red));border-radius:5px;transition:width .6s ease}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.hero.slim{padding:0 0 12px}
.slimrow{display:flex;align-items:center;gap:12px}
.slimrow .lv{font:34px/1 var(--display)}
.slimrow .bar{flex:1;margin:0}
.slimrow span{font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}

/* Tabs */
nav{display:flex;gap:2px;margin:0 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:12px 14px;font:600 15px/1 var(--body);cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
nav button[aria-selected="true"] svg{color:var(--red)}

h2{font:34px/1.05 var(--display);margin:0 0 6px;letter-spacing:.005em}
h3{font:22px/1.1 var(--display);margin:0;letter-spacing:.01em}
p.lead{color:var(--muted);margin:0 0 20px;max-width:58ch}
.small{font-size:14px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;cursor:pointer;background:var(--red);color:var(--red-ink);min-height:50px}
.btn.ghost{background:var(--raise);color:var(--ink)}
.btn.quiet{background:none;color:var(--muted);padding:8px 10px;min-height:0}
.btn.danger{background:none;color:var(--red);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn,.chip,.check,.step button{transition:transform .1s ease,background-color .15s ease}
.btn:not(:disabled):active,.chip:active,.check:active{transform:scale(.96)}
.btn:not(.ghost):not(.quiet):not(.danger):not(:disabled){box-shadow:0 6px 20px -8px rgba(255,31,69,.7)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack>*+*{margin-top:12px}
.notice{border-left:3px solid var(--red);background:var(--surface);padding:14px 16px;border-radius:0 12px 12px 0;margin-bottom:18px}

/* Start */
.start{display:grid;gap:10px}
.start .btn{text-align:left;padding:18px 20px}
.start .btn span{display:block;font-weight:500;font-size:14px;opacity:.8;margin-top:2px}
.start .btn em{display:block;font-style:normal;font-weight:600;font-size:12px;opacity:.85;margin-bottom:4px}
.start .day-next{font:30px/1.05 var(--display);letter-spacing:.01em;padding:18px 20px 16px}
.start .day-next span{font-family:var(--body);letter-spacing:0}
.start .day-next em{font-family:var(--body);letter-spacing:0}
.grp{font:26px/1 var(--display);margin:18px 0 0;letter-spacing:.01em}
.grp:first-child{margin-top:0}

/* Exercise block */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ex-head h3{flex:1;font-size:24px}
.tip{font-size:14px;color:var(--muted);margin:0 0 10px;padding-left:10px;border-left:2px solid var(--violet)}
.tip b{color:var(--ink);font-weight:600}
.set{display:grid;grid-template-columns:22px 1fr 1fr 52px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.set .n{font:18px var(--display);color:var(--muted);text-align:center}
.step{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;background:var(--raise);border-radius:12px;height:50px;overflow:hidden}
.step button{border:0;background:none;height:100%;font-size:22px;font-weight:600;color:var(--muted);cursor:pointer}
.step button:active{background:var(--line)}
.step label{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.step input{width:100%;border:0;background:none;text-align:center;font:24px/1 var(--display);padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input:focus{outline:none}
.step:focus-within{box-shadow:inset 0 0 0 2px var(--violet)}
.step small{font-size:10px;color:var(--muted);line-height:1;margin-top:2px}
.check{width:52px;height:50px;border-radius:12px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.set.done .check{background:var(--red);border-color:var(--red);color:#fff}
.set.done .step{background:var(--red-dim)}
.set.done .n{color:var(--red)}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;padding-top:6px}
.unit{display:inline-flex;background:var(--raise);border-radius:10px;padding:3px}
.unit button{border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.unit button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:6px 10px;border-radius:8px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip:active{border-color:var(--red)}
input.inp,select.inp{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--raise);min-width:0;color:var(--ink)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.dock-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.rest{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.rest .t{font:30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:68px}
.rest .t.over{color:var(--good)}
.rest .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.rest .mini{border:0;background:var(--raise);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer}
.dock .btn{white-space:nowrap}

/* Ranks */
.ranks{display:grid;gap:10px}
.rank-card{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center}
.rank-name{font:18px/1 var(--display);letter-spacing:.02em}
.ladder{display:flex;gap:3px;margin:8px 0 6px}
.ladder i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:14px;color:var(--muted)}
.badge.on{border:1px solid rgba(157,77,255,.55);background:linear-gradient(160deg,var(--violet-dim),transparent 70%);color:var(--ink)}
.rank-card{background:linear-gradient(100deg,color-mix(in srgb,var(--rc) 16%,transparent),transparent 50%),var(--surface)}
.rank-card>svg{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--rc) 45%,transparent))}
.badge strong{display:block;font:18px/1.1 var(--display);margin-bottom:4px;letter-spacing:.01em}

/* History */
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:420px;height:auto}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.hist .d{font:18px/1.3 var(--display);min-width:84px}
.hist .c{flex:1;font-size:15px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:20px;padding:26px 22px;max-width:400px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);text-align:center}
dialog::backdrop{background:rgba(0,0,0,.75)}
.gain{display:flex;align-items:center;justify-content:center;gap:10px;font:72px/1 var(--display);margin:6px 0 2px;color:var(--violet);font-variant-numeric:tabular-nums}
dialog{overflow-x:hidden}
.ru{margin:-6px 0 10px}
.ru-stage{position:relative;width:240px;height:230px;margin:0 auto}
.ru-glow::before,.ru-ring::before{content:"";border-radius:50%}
.ru-glow::before{width:210px;height:210px;background:radial-gradient(circle,var(--rc) 0,transparent 62%);opacity:0;animation:ru-glow .8s ease-out .85s forwards,ru-pulse 2.6s ease-in-out 1.7s infinite}
@keyframes ru-glow{to{opacity:.38}}
@keyframes ru-pulse{0%,100%{opacity:.38;transform:scale(1)}50%{opacity:.2;transform:scale(1.1)}}
.ru-ring::before{width:64px;height:64px;border:3px solid var(--rc);opacity:0;animation:ru-ring .9s cubic-bezier(.2,.7,.3,1) .8s forwards}
.ru-ring.r2::before{animation-delay:1.02s;border-color:#fff}
@keyframes ru-ring{0%{transform:scale(.4);opacity:.95}100%{transform:scale(4.2);opacity:0;border-width:1px}}
.ru-new svg{animation:ru-float 3.2s ease-in-out 1.7s infinite}
@keyframes ru-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ru-tw{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:ru-tw 1.8s ease-in-out infinite}
@keyframes ru-tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.ru-lad{display:flex;gap:4px;max-width:220px;margin:14px auto 4px;opacity:0;animation:ru-fade .4s ease-out 1.75s forwards}
.ru-lad i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ru-lad i.now{background:var(--c);transform-origin:left;transform:scaleX(0);animation:ru-fill .5s ease-out 2.05s forwards;box-shadow:0 0 10px var(--c)}
@keyframes ru-fill{to{transform:scaleX(1)}}
.ru-stage>div{position:absolute;inset:0;display:grid;place-items:center}
.ru-old{animation:ru-shake .6s ease-in-out .1s both,ru-out .15s ease-in .7s forwards}
@keyframes ru-shake{0%,100%{transform:none}20%{transform:translateX(-3px) rotate(-3deg)}40%{transform:translateX(4px) rotate(3deg)}60%{transform:translateX(-6px) rotate(-6deg) scale(1.05)}80%{transform:translateX(6px) rotate(6deg) scale(1.1)}}
@keyframes ru-out{to{transform:scale(1.5);opacity:0}}
.ru-flash{background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 55%);opacity:0;animation:ru-flash .55s ease-out .72s}
@keyframes ru-flash{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.ru-new{opacity:0;animation:ru-pop .75s cubic-bezier(.2,.9,.3,1.4) .85s forwards}
@keyframes ru-pop{0%{opacity:0;transform:scale(.2) rotate(-25deg)}60%{opacity:1;transform:scale(1.22) rotate(6deg)}100%{opacity:1;transform:none}}
.ru-burst{opacity:0;background:repeating-conic-gradient(from 0deg,var(--rc) 0deg 5deg,transparent 5deg 24deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 68%);mask:radial-gradient(circle,transparent 26%,#000 30%,transparent 68%);animation:ru-burst .6s ease-out .85s forwards,ru-spin 14s linear .85s infinite}
@keyframes ru-burst{to{opacity:.5}}
@keyframes ru-spin{to{transform:rotate(360deg)}}
.ru-p{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);background:var(--pc);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:0;animation:ru-p .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ru-p{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.3)}}
.ru-label{font-size:14px;color:var(--muted);opacity:0;animation:ru-fade .4s ease-out 1.3s forwards}
.ru-name{font:68px/1.05 var(--display);background:linear-gradient(110deg,var(--rc) 35%,#fff 50%,var(--rc) 65%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:ru-slam .5s cubic-bezier(.2,.9,.3,1.2) 1.35s forwards,ru-sheen 2.8s ease-in-out 2.1s infinite}
@keyframes ru-sheen{0%{background-position:100% 0}55%,100%{background-position:0 0}}
.ru-burst.b2{background:repeating-conic-gradient(from 12deg,var(--rc) 0deg 2deg,transparent 2deg 17deg);animation:ru-burst2 .6s ease-out .9s forwards,ru-spin 22s linear .9s infinite reverse}
@keyframes ru-burst2{to{opacity:.3}}
.ru.t4 .ru-burst{animation-duration:.6s,10s}
.ru.t5 .ru-burst{animation-duration:.6s,6s}
.ru.t5 .ru-burst.b2{animation-duration:.6s,9s}
.ru-p.sl{width:calc(var(--s) / 3);height:calc(var(--s) * 1.7)}
.ru.t1 .ru-burst,.ru.t1 .ru-ring.r2,.ru.t1 .ru-tw,.ru.t2 .ru-burst.b2,.ru:not(.t4):not(.t5) .ru-ring.r3{display:none}
.ru.t1 .ru-name{animation:ru-slam .5s cubic-bezier(.2,.9,.3,1.2) 1.35s forwards}
.ru.t1 .ru-new svg,.ru.t2 .ru-new svg{animation:none}
.ru-ring.r3::before{animation-delay:1.2s;border-width:5px}
.ru.t4 .ru-old svg,.ru.t5 .ru-old svg{animation:ru-charge .65s ease-in .1s both}
@keyframes ru-charge{from{filter:brightness(1) drop-shadow(0 0 0 #fff)}to{filter:brightness(1.8) drop-shadow(0 0 16px #fff)}}
.ru.t4,.ru.t5{animation:ru-impact .45s ease-out .74s}
@keyframes ru-impact{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.ru-flood{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at 50% 28%,var(--rc),transparent 70%);opacity:0;z-index:0}
.ru.t4 .ru-flood{animation:ru-flood4 1s ease-out .74s forwards}
.ru.t5 .ru-flood{animation:ru-flood5 1.2s ease-out .74s forwards}
@keyframes ru-flood4{30%{opacity:.45}100%{opacity:.14}}
@keyframes ru-flood5{25%{opacity:.85}100%{opacity:.28}}
.ru>*:not(.ru-flood):not(.ru-conf),.ru-after{position:relative;z-index:1}
.ru-conf{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;border-radius:inherit}
.ru-conf i{position:absolute;top:-16px;width:7px;height:12px;border-radius:2px;background:var(--cc);opacity:0;animation:ru-fall var(--du) linear var(--de) forwards}
@keyframes ru-fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:.9;transform:translate(var(--sw),640px) rotate(var(--rt))}}
.ru.t5 .ru-name{font-size:84px;filter:drop-shadow(0 0 14px var(--rc))}
@keyframes ru-slam{0%{opacity:0;transform:scale(1.9);letter-spacing:.25em}100%{opacity:1;transform:none;letter-spacing:.01em}}
.ru-ex{font-weight:600;opacity:0;animation:ru-fade .4s ease-out 1.65s forwards}
.ru-after{opacity:0;animation:ru-fade .45s ease-out 2.25s forwards}
@keyframes ru-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .ru *,.ru-after{animation:none!important;opacity:1!important}
  .ru-old,.ru-flash,.ru-ps,.ru-ring,.ru-conf{display:none!important}
  .ru{animation:none!important}
  .ru-glow::before{animation:none!important;opacity:.3}
  .ru-lad i.now{transform:none}
  .ru-name{color:var(--rc);background:none}
  .ru-burst{opacity:.4!important}
  .bar>i{transition:none}

function genDemo() {
  const profile = { bw: state.profile.bw || 80, sex: state.profile.sex || 'm', custom: [] };
  const exs = PRESETS.slice(0, RANKS.length), n = exs.length, N = 16, now = Date.now();
  const target = exs.map((ex, i) => {
    const k = Math.floor(i * RANKS.length / n);
    const t = ex.std.map(v => v * (profile.sex === 'f' ? ex.f : 1) * profile.bw);
    const lo = k === 0 ? t[0] * 0.7 : t[k-1], hi = k >= t.length ? t[t.length-1] * 1.15 : t[k];
    return (lo + hi) / 2;
  });
  const sessions = [];
  for (let s = 0; s < N; s++) {
    const p = Math.min(1, 0.85 + 0.15 * s / (N - 2));
    const entries = exs.map((ex, i) => ({ ex, i })).filter(o => o.i % 2 === s % 2).map(({ ex, i }) => {
      const w = Math.max(2.5, ceil25(target[i] * p / (1 + 8/30)));
      return { exId: ex.id, sets: [{ w, r:8 }, { w, r:8 }, { w, r:7 }] };
    });
    sessions.push({ id: 'demo' + s, date: Math.round(now - (N - s) * 3.5 * dayMs), entries });
  }
  return { profile, sessions };
}

  return `<div class="ru t${newIdx}" style="--rc:${RCOL(newIdx)}"><div class="ru-flood"></div>${conf ? `<div class="ru-conf">${conf}</div>` : ''}<div class="ru-stage">
    <div class="ru-glow"></div><div class="ru-burst"></div><div class="ru-burst b2"></div>
    <div class="ru-ring"></div><div class="ru-ring r2"></div><div class="ru-ring r3"></div>
    <div class="ru-old">${disc(oldIdx, 116)}</div><div class="ru-flash"></div><div class="ru-new">${disc(newIdx, 136)}</div>
    <div class="ru-ps">${parts(6 + newIdx * 5, RCOL(oldIdx), .72, 100 + newIdx * 6, 11, true)}${parts(4 + newIdx * 3, '#fff', .95, 85 + newIdx * 5, 6)}${tw}</div></div>
    <div class="ru-label">Neuer Rang erreicht</div><div class="ru-name">${RANKS[newIdx]}</div><div class="ru-ex">${esc(name)}</div>
    <div class="ru-lad" aria-hidden="true">${lad}</div></div>`;
}
let previewTimer = null;
function showDialog(html, pre = '', buttons = '') {
  const dl = $('#dlg');
  clearTimeout(previewTimer);
  dl.innerHTML = pre + `<div class="${pre ? 'ru-after' : ''}">${html}${buttons || '<button class="btn block" data-act="closeDlg" autofocus>Weiter</button>'}</div>`;
  if (!dl.open) dl.showModal();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) dl.querySelectorAll('.count').forEach(el => {
    const to = +el.dataset.to, t0 = performance.now() + (pre ? 2300 : 200);
    el.textContent = '+0';
    const step = now => { const p = Math.min(1, Math.max(0, (now - t0) / 1000)); el.textContent = '+' + Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1 && dl.open) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  const m = pre.match(/ru t(\d)/);
  if (m) { const t = +m[1]; setTimeout(() => { try { navigator.vibrate && navigator.vibrate(t >= 5 ? [60,30,60,30,60,30,320] : t >= 3 ? [40,30,40,30,180] : [30,20,120]); } catch {} }, 850); }
}
function preview(to, auto) {
  const next = to < 5
    ? `<button class="btn" data-act="previewRank" data-to="${to + 1}"${auto ? ' data-auto="1"' : ''}>Nächster Rang</button>`
    : `<button class="btn" data-act="previewRank" data-to="1">Von vorn</button>`;
  showDialog(`<p class="small" style="margin:4px 0 16px">Vorschau, Stufe ${to} von 5${auto && to < 5 ? '. Geht gleich automatisch weiter.' : ''}</p>`,
    rankUpHTML(to - 1, to, `${RANKS[to - 1]} → ${RANKS[to]}`),
    `<div class="row" style="justify-content:center">${next}<button class="btn ghost" data-act="closeDlg">Schließen</button></div>`);
  if (auto && to < 5) previewTimer = setTimeout(() => { if ($('#dlg').open) preview(to + 1, true); }, 5200);
}
function saveDraft() {
  const entries = draft.entries.map(e => ({ exId:e.exId, ...(e.unit === 'lvl' ? { unit:'lvl' } : {}), sets:e.sets.filter(s => isDone(s, e.exId)).map(s => ({ w:+s.w, r:Math.round(+s.r) })) })).filter(e => e.sets.length);
  if (!entries.length) return;
  const before = derive();
  const session = { id:'s' + Date.now(), date:draft.date, entries, ...(draft.day ? { day:draft.day } : {}) };
  state.sessions.push(session);
  const after = derive();
  draft = null; persistDraft(); stopRest();
  const prs = entries.filter(e => (e.unit || 'kg') === unitOf(e.exId) && before.best[e.exId] !== undefined && entryBest(e) > before.best[e.exId] + 0.01);
  const ups = exercises().filter(ex => after.ranks[ex.id].idx > before.ranks[ex.id].idx && after.ranks[ex.id].idx > 0).sort((x, y) => after.ranks[y.id].idx - after.ranks[x.id].idx);
  const bA = badges(after), bB = badges(before);
  const newBadges = bA.filter((b, i) => b[2] && !bB[i][2]);
  let html = `<div class="small">Training gespeichert</div><div class="gain">${xpIcon(54)}<span class="count" data-to="${after.xp - before.xp}">+${after.xp - before.xp}</span></div><div class="small">XP verdient</div>`;
  if (after.streak > before.streak) html += `<div class="streakup">${flame(after.streak, 26)}Serie: ${after.streak} ${after.streak === 1 ? 'Woche' : 'Wochen'}</div>`;
  if (after.level > before.level) html += `<h3 style="font-size:26px">Level ${after.level} erreicht</h3>`;
  const pre = ups.length ? rankUpHTML(before.ranks[ups[0].id].idx, after.ranks[ups[0].id].idx, ups[0].name) : '';
  const items = [...prs.map(e => `Neuer Rekord in ${esc(exById(e.exId).name)}: ${e.unit === 'lvl' ? 'Stufe ' + entryBest(e) : fmt(entryBest(e)) + ' kg geschätzt'}`), ...ups.slice(1).map(ex => `${esc(ex.name)} aufgestiegen zu ${RANKS[after.ranks[ex.id].idx]}`), ...newBadges.map(b => `Abzeichen freigeschaltet: ${b[0]}`)];
  html += items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>` : '<p class="small" style="margin:12px 0 18px">Weiter so. Beständigkeit schlägt alles.</p>';
  render(); showDialog(html, pre);
  store.saveSession(session);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-go]'); if (!t) return;
  if (t.dataset.tab || t.dataset.go) { tab = t.dataset.tab || t.dataset.go; render(); return; }
  const a = t.dataset.act, ei = +t.dataset.ei, si = +t.dataset.si;
  if (a === 'start') draft = { date:Date.now(), entries:[] };
  else if (a === 'unit') {
    const en = draft.entries[ei], u = t.dataset.u;
    if ((en.unit || 'kg') === u) return;
    const units = { ...(state.profile.units || {}) };
    if (u === 'lvl') units[en.exId] = 'lvl'; else delete units[en.exId];
    state.profile.units = units; store.saveProfile();
    draft.entries[ei] = newEntry(en.exId);
  }
  else if (a === 'startDay') {
    const dy = activePlan()?.days.find(x => x.id === t.dataset.day); if (!dy) return;
    draft = { date:Date.now(), day:dy.id, entries: dy.ex.filter(id => exById(id)).map(newEntry) };
  }
  else if (a === 'repeat') { const last = [...state.sessions].sort((x,y) => y.date - x.date)[0]; draft = { date:Date.now(), entries: last.entries.filter(en => exById(en.exId)).map(en => newEntry(en.exId)) }; }
  else if (a === 'addEx') draft.entries.push(newEntry(t.dataset.id));
  else if (a === 'rmEx') draft.entries.splice(ei, 1);
  else if (a === 'addSet') { const s = draft.entries[ei].sets, prev = s[s.length-1], sg = suggestion(draft.entries[ei].exId); s.push({ w: prev ? prev.w : sg.w, r: prev ? prev.r : sg.r, done:false }); }
  else if (a === 'rmSet') draft.entries[ei].sets.splice(si, 1);
  else if (a === 'step') {
    const s = draft.entries[ei].sets[si], k = t.dataset.k, d = +t.dataset.d;
    const ex = exById(draft.entries[ei].exId);
    if (k === 'w' && draft.entries[ei].unit === 'lvl') s.w = Math.min(20, Math.max(1, (s.w || 0) + d));
    else if (k === 'w') s.w = Math.max(0, (s.w || 0) + d * (ex?.inc || 2.5));
    else s.r = Math.max(0, (s.r || 0) + d);
  }
  else if (a === 'done') {
    const s = draft.entries[ei].sets[si];
    if (exById(draft.entries[ei].exId)?.bwx && s.w == null) s.w = 0;
    if (!s.done && !isDone({ ...s, done:true }, draft.entries[ei].exId)) { const inp = document.querySelector(`input[data-ei="${ei}"][data-si="${si}"][data-k="${s.w > 0 ? 'r' : 'w'}"]`); inp && inp.focus(); return; }
    s.done = !s.done;
    if (s.done) startRest(exById(draft.entries[ei].exId)?.lower ? 120 : 90);
  }
  else if (a === 'rest30') { if (rest) { rest.end = Math.max(Date.now(), rest.end) + 30000; rest.buzzed = false; } }
  else if (a === 'restStop') stopRest();
  else if (a === 'discard') { askConfirm('Dieses Training verwerfen?', 'Verwerfen', () => { draft = null; stopRest(); persistDraft(); render(); }); return; }
  else if (a === 'save') { saveDraft(); return; }
  else if (a === 'closeDlg') { pendingConfirm = null; clearTimeout(previewTimer); $('#dlg').close(); return; }
  else if (a === 'okDlg') { const fn = pendingConfirm; pendingConfirm = null; $('#dlg').close(); fn && fn(); return; }
  else if (a === 'hist') histEx = t.dataset.id;
  else if (a === 'delSession') {
    const id = t.dataset.id;
    askConfirm('Dieses Training löschen? XP und Rekorde werden neu berechnet.', 'Löschen', () => { state.sessions = state.sessions.filter(s => s.id !== id); store.deleteSession(id); render(); });
    return;
  }
  else if (a === 'saveProfile') {
    const bw = num($('#bw').value);
    if (!bw || bw < 30 || bw > 300) { $('#bwErr').textContent = 'Trag ein Körpergewicht zwischen 30 und 300 kg ein.'; return; }
    state.profile.bw = bw; state.profile.sex = $('#sex').value; state.profile.plan = $('#plan').value; store.saveProfile(); tab = 'raenge';
  }
  else if (a === 'addCustom') {
    const name = $('#cName').value.trim(); if (!name) return;
    state.profile.custom = [...(state.profile.custom||[]), { id:'c' + Date.now(), name, lower: $('#cLower').value === '1', std:[0.5,0.75,1,1.25,1.5], f:0.7 }];
    store.saveProfile();
  }
  else if (a === 'demoOn') {
    if (!ready || demo) return;
    demo = { state, store, draft };
    state = genDemo(); draft = null; stopRest();
    const save = () => {};
    store = { mode:'demo', saveProfile:save, saveSession:save, deleteSession:save };
    tab = 'raenge';
  }
  else if (a === 'demoOff') {
    if (!demo) return;
    ({ state, store, draft } = demo); demo = null; stopRest();
  }
  else if (a === 'previewRank') { preview(+t.dataset.to || 1, !!t.dataset.auto); return; }
  else if (a === 'exportData') {
    if (demo) { $('#ioMsg').textContent = 'Beende zuerst den Demo-Modus.'; return; }
    const name = `kraftstufe-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([JSON.stringify({ app:'kraftstufe', version:1, exported:Date.now(), state })], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) navigator.share({ files:[file], title:'Kraftstufe Backup' }).catch(() => {});
    else { const url = URL.createObjectURL(file); const l = document.createElement('a'); l.href = url; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
    return;
  }
  else if (a === 'importData') { if (demo) { $('#ioMsg').textContent = 'Beende zuerst den Demo-Modus.'; return; } $('#importFile').click(); return; }
  else if (a === 'rmCustom') { state.profile.custom = state.profile.custom.filter(c => c.id !== t.dataset.id); store.saveProfile(); }
  persistDraft(); render();
});
document.addEventListener('input', e => {
  const i = e.target;
  if (i.dataset.k && draft) {
    const s = draft.entries[+i.dataset.ei].sets[+i.dataset.si];
    let v = num(i.value);
    if (v != null && i.dataset.k === 'w' && draft.entries[+i.dataset.ei].unit === 'lvl') v = Math.min(20, Math.max(1, Math.round(v)));
    s[i.dataset.k] = v;
    persistDraft();
    if (s.done) renderDock();
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const st = data && data.state;
      if (data.app !== 'kraftstufe' || !st || !st.profile || !Array.isArray(st.sessions)) throw new Error('format');
      askConfirm(`Backup mit ${st.sessions.length} Trainings laden? Deine aktuellen Daten auf diesem Gerät werden ersetzt.`, 'Ersetzen', () => {
        state = { profile: Object.assign({ bw:null, sex:'m', custom:[] }, st.profile), sessions: st.sessions };
        lsSet('kraftstufe-data', state); tab = 'raenge'; render();
      });
    } catch { $('#ioMsg').textContent = 'Diese Datei ist kein gültiges Kraftstufe-Backup.'; }
  };
  reader.readAsText(e.target.files[0]);
  e.target.value = '';
});
document.addEventListener('focusin', e => { if (e.target.matches('.step input')) e.target.select(); });

/* ---------- storage ---------- */
function localStore() {
  const save = () => lsSet('kraftstufe-data', state);
  return { mode:'local', saveProfile:save, saveSession:save, deleteSession:save };
}
async function cloudStore() {
  if (!window.claude || !window.claude.use) return null;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return null;
  const uid = await user.id(); if (!uid) return null;
  const profRef = db.doc(`data/users/${uid}/profile`);
  const sessCol = profRef.collection('sessions');
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000));
  const [pSnap, sSnap] = await Promise.race([Promise.all([profRef.get(), sessCol.get()]), timeout]);
  let chain = Promise.resolve();
  const q = fn => { chain = chain.then(fn).catch(err => { console.error(err); $('#status').textContent = 'Speichern fehlgeschlagen. Deine Daten bleiben vorerst auf diesem Gerät.'; lsSet('kraftstufe-data', state); }); };
  const local = lsGet('kraftstufe-data');
  if (pSnap.exists || !sSnap.empty) {
    if (pSnap.exists) state.profile = Object.assign({ bw:null, sex:'m', custom:[] }, pSnap.data());
    state.sessions = sSnap.docs.map(d => d.data());
  } else if (local) {
    state = local;
    q(() => profRef.set(state.profile));
    state.sessions.forEach(s => q(() => sessCol.doc(s.id).set(s)));
  }
  return {
    mode:'cloud',
    saveProfile: () => q(() => profRef.set(state.profile)),
    saveSession: s => q(() => sessCol.doc(s.id).set(s)),
    deleteSession: id => q(() => sessCol.doc(id).delete()),
  };
}
async function init() {
  document.querySelectorAll('#tabs button').forEach(b => b.insertAdjacentHTML('afterbegin', `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICONS[b.dataset.tab]}</svg>`));
  const local = lsGet('kraftstufe-data');
  if (local && local.sessions) state = local;
  draft = lsGet('kraftstufe-draft');
  if (draft) draft.entries.forEach(en => en.sets.forEach(s => { if (s.done === undefined) s.done = s.w > 0 && s.r > 0; }));
  store = localStore();
  render();
  let cloud = null;
  try { cloud = await cloudStore(); } catch (err) { console.warn(err); }
  if (cloud) { store = cloud; $('#status').textContent = 'Deine Daten werden in deinem Konto gespeichert und sind nur für dich sichtbar.'; }
  else $('#status').textContent = 'Deine Daten werden auf diesem Gerät gespeichert. Sichere sie ab und zu im Profil.';
  ready = true;
  render();
}
init();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW', err)));
}
})();
</script>
